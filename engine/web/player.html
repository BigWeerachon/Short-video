<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAAKIN Player</title>
<style>
  @font-face { font-family: 'Kanit'; font-weight: 700; src: url('fonts/kanit-thai-700.woff2') format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: 'Kanit'; font-weight: 700; src: url('fonts/kanit-latin-700.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2190-21FF, U+2713; }
  @font-face { font-family: 'Kanit'; font-weight: 500; src: url('fonts/kanit-thai-500.woff2') format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: 'Kanit'; font-weight: 500; src: url('fonts/kanit-latin-500.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2190-21FF; }
  html, body { margin: 0; background: #111; color: #eee; font-family: Kanit, system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
  canvas { width: min(100vw - 16px, calc((100vh - 70px) * 9 / 16)); aspect-ratio: 9 / 16; background: #000; border-radius: 8px; }
  #bar { display: flex; gap: 8px; align-items: center; width: min(100vw - 16px, 540px); }
  #bar button { font: inherit; background: #2a2a3a; color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; }
  #seek { flex: 1; }
  #time { font-size: 13px; min-width: 84px; text-align: right; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="bar">
    <button id="play" aria-label="เล่น/หยุด">▶</button>
    <button id="restart" aria-label="เริ่มใหม่">⟲</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="เลื่อนเวลา">
    <button id="subs" aria-label="ซับเปิด/ปิด">CC</button>
    <span id="time">0:00</span>
  </div>
  <audio id="a" preload="auto"></audio>
</div>
<script type="module" src="player.js"></script>
</body>
</html>
