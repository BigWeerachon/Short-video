  --radius: 14px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(24px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; color: #ffffff; letter-spacing: 0.2px; }
.sync { font-size: 12px; color: var(--muted); }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 17px; margin: 0; }
.view { display: flex; flex-direction: column; gap: 14px; }
/* ออฟฟิศ */
.office { position: relative; border-radius: var(--radius); overflow: hidden; background: #1f1e1d; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
.office canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.office .room { position: absolute; transform: translateX(-50%); font-family: var(--font-display); font-size: 10.5px; font-weight: 500; padding: 0 7px; border-radius: 5px;
  background: rgba(31, 30, 29, 0.85); color: #faf9f5; border: 1.5px solid rgba(250, 249, 245, 0.3); white-space: nowrap; pointer-events: none; }
  .office .say { position: absolute; z-index: 2; transform: translate(-50%, -100%); font: 500 11px Kanit, system-ui, sans-serif; color: #2b2433; background: #fffdf6;
    border: 2px solid #2b2433; border-radius: 6px; padding: 1px 7px; white-space: nowrap; pointer-events: none; }
  .office .say::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -4px; border: 4px solid transparent; border-top-color: #2b2433; }
.office .room.on { background: linear-gradient(90deg, #0a6fc9, #2fdfa0); border-color: #faf9f5; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #0a6fc9, #13a9c4 50%, #2fdfa0); border-radius: 99px; transition: width .4s; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.steps li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); justify-self: center; }
.steps li.done .dot { background: var(--ok); }
.steps li.now .dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.steps li.done span:nth-child(2) { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; }
/* คลังงาน */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 99px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: #0a6fc9; color: #ffffff; }
.chip .n { font-size: 11px; min-width: 18px; padding: 0 5px; border-radius: 99px; background: rgba(255,255,255,0.1); text-align: center; }
.chip[aria-pressed="true"] .n { background: rgba(255,255,255,0.22); }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.pill.ready { background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); }
.pill.posted { background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
.pill.review { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.draft { background: color-mix(in srgb, var(--muted) 12%, transparent); color: var(--muted); }
.item { gap: 12px; padding: 0; overflow: hidden; }
.item-head { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 14px 14px 0; }
.kind { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #0a6fc9, #2fdfa0); color: #fff; }
.kind svg { width: 22px; height: 22px; }
.item h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
.item .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.plats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 14px; }
.plat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; border-radius: 10px; background: var(--bg); font-size: 11.5px; color: var(--muted); text-align: center; }
.plat b { font-weight: 600; font-size: 12px; color: var(--ink); }
.plat.posted { background: color-mix(in srgb, var(--accent-2) 12%, var(--bg)); color: var(--accent-2); }
.toggle { font: inherit; font-size: 14px; font-weight: 500; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--accent); padding: 11px 14px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.toggle svg { width: 18px; height: 18px; transition: transform .2s; }
.toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.capbox { display: flex; flex-direction: column; gap: 10px; padding: 0 14px 14px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--bg); border-radius: 12px; }
.seg button { font: inherit; font-size: 12.5px; font-weight: 500; border: 0; border-radius: 9px; padding: 7px 2px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.cap pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font-body); font-size: 14.5px; line-height: 1.6; background: var(--bg); border-radius: 12px; padding: 12px 14px; max-height: 260px; overflow: auto; }
.capfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.postrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
a.go { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #0a6fc9; color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; }
a.go svg { width: 16px; height: 16px; }
button.mark { font: inherit; font-size: 13px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
button.mark.on { border-color: color-mix(in srgb, var(--accent-2) 50%, transparent); color: var(--accent-2); }
button.dl { font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.steps3 { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
button.copy { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 11px; border: 0; background: linear-gradient(90deg, #0a6fc9, #13a9c4); color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button.copy svg { width: 16px; height: 16px; }
button.copy.done { background: var(--accent-2); color: #10261d; }
button:focus-visible, .chip:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
.item { gap: 10px; padding: 12px; }
.item-head { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 0; }
.kind { width: 40px; height: 40px; border-radius: 10px; }
.item h3 { font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.st.ready { color: var(--accent-2); } .st.posted { color: var(--muted); } .st.review { color: var(--warn); }
.seg button.done { color: var(--accent-2); }
.cap { display: flex; flex-direction: column; gap: 8px; }
.cap pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font-body); font-size: 13.5px; line-height: 1.55; background: var(--bg); border-radius: 10px; padding: 10px 12px; max-height: 132px; overflow: auto; }
.postrow { display: grid; grid-template-columns: 1fr 44px; gap: 8px; }
a.go { padding: 11px 12px; border-radius: 11px; font-size: 14.5px; }
a.go svg { width: 20px; height: 20px; flex: none; }
a.go-youtube { background: #ff0000; color: #fff; }
a.go-facebook { background: #1877f2; color: #fff; }
a.go-tiktok { background: #000000; color: #fff; box-shadow: inset 0 0 0 1px #3a3a3a; }
a.go-instagram { background: linear-gradient(45deg, #f58529, #dd2a7b 45%, #8134af 75%, #515bd4); color: #fff; }
button.mark { padding: 0; border-radius: 11px; font-size: 16px; font-weight: 700; }
button.mark.on { background: color-mix(in srgb, var(--accent-2) 18%, var(--bg)); }
button.dl { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 10px; }
button.dl svg { width: 18px; height: 18px; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 9; background: var(--ink); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 10px; white-space: nowrap; }
/* รายงาน */
.rep { gap: 10px; }
.todo { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; background: #0a6fc9; color: #fff; }
.todo b { font-size: 12px; font-weight: 600; opacity: .85; }
.todo span { font-size: 14.5px; line-height: 1.5; }
.sum { margin: 0; font-size: 14px; color: var(--ink); }
.tok { display: grid; gap: 4px; font-size: 13px; }
.bar.thin { height: 5px; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; font-size: 13.5px; }
.facts li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.facts li .muted { font-size: 12.5px; }
button.more { justify-self: start; font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer; }
.report { gap: 12px; }
.report-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.report-head h2 { font-size: 16px; line-height: 1.35; }
.date { font-size: 12px; color: var(--muted); background: var(--bg); padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.kv { display: grid; gap: 8px; margin: 0; }
.kv div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 12px; background: var(--bg); border-radius: 10px; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.kv .next { background: var(--accent-soft); }
.kv .next dt, .kv .next dd { color: var(--ink); }
.plain { margin: 0; font-size: 14px; white-space: pre-wrap; }
.lesson { display: grid; gap: 4px; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
.lesson .row { justify-content: flex-start; gap: 8px; }
.section-title { font-family: var(--font-display); font-weight: 500; font-size: 15px; color: var(--muted); margin: 6px 2px -4px; }
/* แท็บล่าง */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 4px 6px; margin-inline: -4px; }

nav.tabs .in { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
nav.tabs button { font: inherit; font-family: var(--font-display); font-weight: 500; font-size: 14px; border: 0; background: none; color: var(--muted);
  padding: 7px 4px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 6px; }
nav.tabs button svg { width: 18px; height: 18px; }
nav.tabs button[aria-selected="true"] { color: #ffffff; background: #0a6fc9; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

<script>// fst-pixel-game — เกมในบ้าน มุมมองด้านบนเฉียง (bird's-eye 3/4)

  // พนักงาน: [รหัสสไปรต์, ชื่อตำแหน่ง, x, y(เท้า), ทิศ]
  const STAFF = [

  const ROLE_TO_STAFF = { director: 'director', writer: 'writer', sound: 'sound', 'film-director': 'film', animator: 'animator', editor: 'editor', critic: 'critic', marketer: 'marketer', planner: 'planner', librarian: 'librarian', 'qa-visual': 'qav', 'qa-motion': 'qam', 'qa-av': 'qaa' };
  let activeId = null, studio = false;

  let sheet, img, ctx, cv, solids = [], nav, navW, navH;
  const fr = (n) => sheet.frames[n].frame;
  function draw(name, x, y, flip = false) {

    if (!flip) { ctx.drawImage(img, f.x, f.y, f.w, f.h, Math.round(x), Math.round(y), f.w, f.h); return; }
    ctx.save(); ctx.translate(Math.round(x) + f.w, Math.round(y)); ctx.scale(-1, 1);
    ctx.drawImage(img, f.x, f.y, f.w, f.h, 0, 0, f.w, f.h); ctx.restore();
  }

  // ---- ชน ----
  function buildSolids() {
    solids = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (isWall(tileAt(c, r))) solids.push({ x: c * T, y: r * T, w: T, h: T, exit: tileAt(c, r) === 'E' });
    for (const [n, x, y, k] of PROPS) if (Array.isArray(k)) solids.push({ x: x + k[0], y: y + k[1], w: k[2], h: k[3] });
  }
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const box = (e, x = e.x, y = e.y) => ({ x: x - e.hw, y: y - e.hh, w: e.hw * 2, h: e.hh });
  function blocked(e, x, y, others = []) {
    const b = box(e, x, y);
    for (const s of solids) if (hit(b, s)) return s;
    for (const o of others) if (o !== e && hit(b, box(o))) return o;
    return null;
  }

  // ---- ตารางเดิน (ช่อง 8px) สำหรับ NPC ----
  function buildNav() {
    navW = MW / 8; navH = MH / 8; nav = new Uint8Array(navW * navH);
    const probe = { hw: 4, hh: 5 };
    for (let r = 0; r < navH; r++) for (let c = 0; c < navW; c++) nav[r * navW + c] = blocked(probe, c * 8 + 4, r * 8 + 6) ? 0 : 1;
  }
  function path(from, to) {
    const K = (c, r) => r * navW + c, prev = new Int32Array(navW * navH).fill(-1), s = K(from.c, from.r), g = K(to.c, to.r);
    if (!nav[g]) return null;
    const q = [s]; prev[s] = s;
    for (let i = 0; i < q.length; i++) {
      const k = q[i]; if (k === g) break;
      const c = k % navW, r = (k / navW) | 0;
      for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {

      }
    }
    if (prev[g] < 0) return null;
    const out = [];
    for (let k = g; k !== s; k = prev[k]) out.unshift({ x: (k % navW) * 8 + 4, y: ((k / navW) | 0) * 8 + 6 });
    return out;
  }
  const cellOf = (e) => ({ c: Math.max(0, Math.min(navW - 1, Math.floor(e.x / 8))), r: Math.max(0, Math.min(navH - 1, Math.floor((e.y - 6) / 8 + 0.5))) });
  function randomTarget(e, maxD) {
    const here = cellOf(e);
    for (let tries = 0; tries < 40; tries++) {
      const c = here.c + Math.round((Math.random() * 2 - 1) * maxD), r = here.r + Math.round((Math.random() * 2 - 1) * maxD);

  const actors = [hero, maid];

  function face(e, vx, vy) {

  // ---- อินพุต ----
  const keys = new Set();

  addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

  // ---- ข้อความ ----
  let msgTimer = 0;
  function say(text) { const el = document.getElementById('msg'); el.textContent = text; el.hidden = false; msgTimer = 2.4; }

  function update(dt) {

    // ผู้เล่น: 8 ทิศ (ทแยงได้)
    let ix = 0, iy = 0;
    if (keys.has('arrowleft') || keys.has('a')) ix -= 1; if (keys.has('arrowright') || keys.has('d')) ix += 1;
    if (keys.has('arrowup') || keys.has('w')) iy -= 1; if (keys.has('arrowdown') || keys.has('s')) iy += 1;

  function animate(e, dt, fps) { if (e.moving) { e.t += dt; e.f = Math.floor(e.t * fps) % 4; } else { e.f = 0; e.t = 0; } }

  }

  // ---- โหมดสตูดิโอ: พนักงานเดินเอาแฟ้มไปส่งงาน ----
  function nearestWalkable(x, y) {

  function staffRoute(p, to) {

  }
  // ขั้นตอนของพนักงาน: เดินไปจุดหนึ่ง → ทำอะไรสักอย่าง → เดินกลับที่นั่ง
  const SPOTS = { cooler: { x: 316, y: 186 }, printer: { x: 258, y: 156 }, coffee: { x: 300, y: 164 }, meetA: { x: 160, y: 104 }, meetB: { x: 192, y: 104 } };
  const CHAT = ['กาแฟหน่อย ☕', 'ไอเดียใหม่!', 'ช็อตนี้สวยมาก', 'ประชุมกี่โมง?', 'บทใหม่มาแล้ว', 'พักสายตาแป๊บ', 'ซับไม่ล้นแล้วนะ', 'ลูกค้าชอบแน่', 'เพลงนี้ติดหู', 'ส่งไฟล์ให้แล้ว'];
  const REPLY = ['เยี่ยมเลย!', 'โอเค!', 'จริงด้วย', 'เดี๋ยวดูให้', '555', 'ได้เลย'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const idle = (p) => !p.route && !p.plan && p.id !== activeId;
  function speak(p, text, dur) { p.speech = { text, until: performance.now() + dur * 1000 }; }
  function goTo(p, pt, then) { p.route = [...staffRoute(p, pt), { x: pt.x, y: pt.y }]; p.then = then; p.plan = true; }
  function goHome(p) { p.carry = false; goTo(p, p.seat, () => { p.x = p.seat.x; p.y = p.seat.y; p.dir = p.seat.dir; p.flip = false; p.plan = null; }); }
  function waitThen(p, sec, fn) { p.pause = sec; p.afterPause = fn; }

  // (ข) ส่งงานต่อ = สองคนเดินไปเจอกันที่ห้องประชุม คุยตามโน้ตส่งงานจริง แล้วแยกย้าย
  let note = '';
  function setRole(role, active = true, handoffNote = '') {
    const id = active ? ROLE_TO_STAFF[role] || null : null;
    if (handoffNote) note = handoffNote;
    if (id && activeId && id !== activeId) {
      const from = STAFF.find((s) => s.id === activeId), to = STAFF.find((s) => s.id === id);
      if (from && to) meet(from, to, note || 'ส่งงานต่อนะ', 'รับทราบ! เริ่มเลย');
    }

  }
  function meet(a, b, lineA, lineB) {
    for (const p of [a, b]) { p.route = null; p.pause = 0; p.afterPause = null; p.then = null; }
    let arrived = 0;
    const talk = () => {
      if (++arrived < 2) return;
      a.dir = 'side'; a.flip = false; b.dir = 'side'; b.flip = true;
      speak(a, lineA, 3.2);
      waitThen(a, 3.4, () => { speak(b, lineB, 2.2); waitThen(b, 2.4, () => { goHome(a); goHome(b); }); });
    };

    goTo(a, SPOTS.meetA, talk); goTo(b, SPOTS.meetB, talk);
  }

  // (ก) ชีวิตประจำวัน: สุ่มคนว่างลุกไปตู้น้ำ/กาแฟ/เครื่องพิมพ์ หรือเดินไปคุยโต๊ะเพื่อน
  let ambientIn = 3;
  function ambient() {
    const free = STAFF.filter(idle);
    if (free.length < 2 || STAFF.filter((p) => p.plan).length >= 3) return;
    const p = pick(free);
    if (Math.random() < 0.45) {
      const q = pick(free.filter((x) => x !== p));
      const near = { x: q.seat.x + (q.seat.dir === 'up' ? 0 : 14), y: q.seat.y + (q.seat.dir === 'up' ? 14 : 16) };
      goTo(p, near, () => { p.dir = 'up'; speak(p, pick(CHAT), 2.6); waitThen(p, 2.8, () => { speak(q, pick(REPLY), 1.8); waitThen(p, 2.0, () => goHome(p)); }); });
    } else {
      const [spot, line] = pick([[SPOTS.cooler, 'น้ำเย็นชื่นใจ'], [SPOTS.coffee, 'กาแฟหน่อย ☕'], [SPOTS.printer, 'ปริ้นต์สคริปต์']]);
      goTo(p, spot, () => { p.dir = 'up'; speak(p, line, 2.2); waitThen(p, 2.6, () => goHome(p)); });
    }
  }
  function updateStaff(dt) {
    ambientIn -= dt;
    if (ambientIn <= 0) { ambient(); ambientIn = 5 + Math.random() * 7; }
    for (const p of STAFF) {
      if (p.pause > 0) { p.pause -= dt; p.walking = false; if (p.pause <= 0 && p.afterPause) { const f = p.afterPause; p.afterPause = null; f(); } continue; }
      if (!p.route) continue;
      if (!p.route.length) { p.route = null; p.walking = false; const f = p.then; p.then = null; if (f) f(); continue; }

      p.walking = true; face(p, dx, dy); p.t += dt; p.f = Math.floor(p.t * 8) % 4;
      if (d <= v) { p.x = q.x; p.y = q.y; p.route.shift(); } else { p.x += dx / d * v; p.y += dy / d * v; }
    }
  }
  // บอลลูนคำพูด (HTML ให้อ่านภาษาไทยได้คมชัด)
  const sayEls = new Map();
  function placeSpeech() {
    const host = studio ? cv.parentElement : document.body, now = performance.now();
    for (const p of STAFF) {
      let el = sayEls.get(p.id);
      const on = p.speech && p.speech.until > now;
      if (!on) { if (el) el.hidden = true; continue; }
      if (!el) { el = document.createElement('div'); el.className = 'say'; host.appendChild(el); sayEls.set(p.id, el); }
      el.hidden = false; el.textContent = p.speech.text;
      const x = p.x, y = p.y - 30;
      if (studio) { el.style.left = (x / MW * 100) + '%'; el.style.top = (y / MH * 100) + '%'; }
      else { el.style.left = (x - Math.round(cam.x)) * view.scale + 'px'; el.style.top = (y - Math.round(cam.y)) * view.scale + 'px'; }
    }
  }
  function bubble(x, y, time) {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 8, y - 6, 16, 9); ctx.fillRect(x - 9, y - 5, 18, 7); ctx.fillRect(x - 1, y + 3, 3, 2);
    const k = Math.floor(time / 300) % 3;
    for (let i = 0; i < 3; i++) { ctx.fillStyle = i === k ? '#2f6fdf' : '#9aa3bd'; ctx.fillRect(x - 5 + i * 4, y - 2, 2, 2); }
  }

  // ---- วาด ----
  let view = { w: 200, h: 300, scale: 2 }, cam = { x: 0, y: 0 };
  function resize() {
    if (studio) { view = { scale: cv.clientWidth / MW || 1, w: MW, h: MH }; cv.width = MW; cv.height = MH; ctx.imageSmoothingEnabled = false; return; }
    const W = innerWidth, H = innerHeight;
    const scale = Math.max(1, Math.floor(Math.min(W / 190, H / 210)));
    view = { scale, w: Math.ceil(W / scale), h: Math.ceil(H / scale) };
    cv.width = view.w; cv.height = view.h;
    cv.style.width = view.w * scale + 'px'; cv.style.height = view.h * scale + 'px';
    ctx.imageSmoothingEnabled = false;
  }
  function spriteOf(e) {
    return `${e.kind}_${e.dir}_${e.f}`;
  }
  let labelEls = [];
  function placeLabels() {
    if (!labelEls.length) labelEls = LABELS.map(([t]) => { const d = document.createElement('div'); d.className = 'room'; d.textContent = t; (studio ? cv.parentElement : document.body).appendChild(d); return d; });
    LABELS.forEach(([, x, y], i) => {
      const el = labelEls[i];
      if (studio) { el.style.left = (x / MW * 100) + '%'; el.style.top = (y / MH * 100) + '%'; return; }
      el.style.left = (x - Math.round(cam.x)) * view.scale + 'px'; el.style.top = (y - Math.round(cam.y)) * view.scale + 'px';
    });
    if (studio) { const act = STAFF.find((s) => s.id === activeId); labelEls.forEach((el, i) => el.classList.toggle('on', !!act && roomOf(act.seat) === i)); }
  }
  function roomOf(pt) { if (pt.y > 120) return 3; return pt.x < 112 ? 0 : pt.x < 224 ? 1 : 2; }
  function render(time) {
    if (studio) { cam.x = 0; cam.y = 0; placeLabels(); }
    else renderCam();
    placeSpeech();
    drawWorld(time);
  }
  function renderCam() {
    // กล้องตามผู้เล่น (ถ้าแผนที่เล็กกว่าจอ วางกึ่งกลาง)
    const cx = MW <= view.w ? (MW - view.w) / 2 : Math.max(0, Math.min(MW - view.w, hero.x - view.w / 2));
    const cy = MH <= view.h ? (MH - view.h) / 2 : Math.max(0, Math.min(MH - view.h, hero.y - 12 - view.h / 2));
    cam.x += (cx - cam.x) * 0.2; cam.y += (cy - cam.y) * 0.2;
    placeLabels();
    const near = STAFF.reduce((b, p) => { const d = Math.hypot(p.x - hero.x, p.y - hero.y); return d < 34 && (!b || d < b.d) ? { p, d } : b; }, null);
    const tag = document.getElementById('tag');
    if (near) { tag.hidden = false; tag.textContent = near.p.name; tag.style.left = (near.p.x - Math.round(cam.x)) * view.scale + 'px'; tag.style.top = (near.p.y - 30 - Math.round(cam.y)) * view.scale + 'px'; } else tag.hidden = true;
  }
  function drawWorld(time) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#1b1722'; ctx.fillRect(0, 0, view.w, view.h);
    ctx.setTransform(1, 0, 0, 1, -Math.round(cam.x), -Math.round(cam.y));
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const ch = tileAt(c, r), x = c * T, y = r * T;
      if (FLOOR[ch]) { draw(FLOOR[ch], x, y); continue; }
      const below = tileAt(c, r + 1);
      if (ch === 'E') { draw('t_floor_living', x, y); continue; }
      if (FLOOR[below]) {
        draw('t_wall_face', x, y);
        if (FLOOR[tileAt(c, r - 1)] || isWall(tileAt(c - 1, r - 1)) || r === 0) { ctx.fillStyle = '#4c4256'; ctx.fillRect(x, y, T, 5); ctx.fillStyle = '#3a3142'; ctx.fillRect(x, y + 4, T, 1); } // สันผนัง
      } else draw('t_wall_top', x, y);
    }
    draw('exit_door', EXIT.x, EXIT.y);
    for (const [n, x, y, k] of PROPS) if (k === 'wall' || k === 'floor') draw(n, x, y);
    const list = PROPS.filter((p) => Array.isArray(p[3])).map(([n, x, y, k]) => ({ y: y + k[1] + k[3], n, x, py: y }))
      .concat((studio ? [maid] : actors).map((e) => ({ y: e.y, e })))
      .concat(STAFF.map((p) => ({ y: p.y + (!p.walking && p.dir === 'up' ? 4 : 0), p })));

      if (it.n) { draw(it.n, it.x, it.py); continue; }

        const p = it.p;

          const n = `staff_${p.id}_${p.dir}_${f}`, fm = fr(n); draw(n, p.x - fm.w / 2, p.y - fm.h + 1);

      }
      const e = it.e, f = fr(spriteOf(e));
      ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(Math.round(e.x), Math.round(e.y) - 1, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();

  // ---- จอยสติ๊กบนมือถือ ----

  }

    cv = document.getElementById('game'); ctx = cv.getContext('2d');
    buildSolids(); buildNav(); resize(); addEventListener('resize', resize); if (!studio) setupTouch();
    let last = performance.now();
    const loop = (now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); render(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);

  };
})();

  tabs.forEach((t) => $('tab-' + t).addEventListener('click', () => show(t)));
  try { const t = localStorage.getItem('tab'); if (tabs.includes(t)) show(t); } catch (e) {}

  // ---------- ออฟฟิศ: แผนที่เกม fst-pixel-game ในโหมดสตูดิโอ (พนักงานเดินส่งงานตามงานจริง) ----------
  function onJob() {
    const role = S.job && S.job.status !== 'done' ? S.job.role : null;
    if (window.__game) window.__game.setRole(role, !!role, (S.job && S.job.note) || '');
  }
  (async () => {
    const img = new Image(); img.src = window.SHEET_SRC; await img.decode();
    window.SHEET_IMG = img; startGame({ studio: true }); onJob();
  })();

  // ---------- การ์ดงานปัจจุบัน ----------
  function renderJob() {
    const j = S.job, el = $('jobCard');
    if (!j) {
      el.innerHTML = `<div class="empty"><h2>ยังไม่มีงาน</h2><p class="muted">สั่ง <b>/make-clip</b> ใน Claude Code พร้อมแนบบทและไฟล์เสียง แล้วทีมจะเริ่มทำงานที่นี่</p></div>`;
      return;
    }
    const pct = Math.round((j.progress || 0) * 100);
    const steps = (j.timeline || []).map((s) => {
      const cls = s.done ? 'done' : s.role === j.role && j.status !== 'done' ? 'now' : '';
      return `<li class="${cls}"><span class="dot"></span><span>${esc(s.stage)} · <span class="muted">${esc(ROLE_TH[s.role] || s.role)}</span></span><span class="muted tnum">${s.done ? 'เสร็จ' : esc(s.eta || '')}</span></li>`;
    }).join('');
    const tk = j.tokens || {};
    el.innerHTML = `
      <div class="row"><h2>${esc(j.title)}</h2><span class="pill ${j.status === 'done' ? 'ready' : ''}">${j.status === 'done' ? 'เสร็จแล้ว' : esc(ROLE_TH[j.role] || j.role) + ' กำลังทำ'}</span></div>
      <div class="muted">${esc(j.stage || '')}</div>
      <div class="bar" aria-label="ความคืบหน้า ${pct}%"><i style="width:${pct}%"></i></div>
      <div class="row muted tnum"><span>คืบหน้า ${pct}%</span><span>token ${fmtK(tk.used)} / ${fmtK(tk.budget)}</span></div>
      ${steps ? `<ul class="steps">${steps}</ul>` : ''}`;
  }
  const fmtK = (n) => (n == null ? '–' : n >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n));

  // ---------- คลังงาน ----------
  const FILTERS = [['all', 'ทั้งหมด'], ...Object.entries(TYPE_TH)];
  const ICON = {
    story_clip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>',
    promo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M17 9a4 4 0 010 6"/></svg>',
    news: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
    event: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  };
  const COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>';
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  const open = {}; // id → แพลตฟอร์มที่เลือก (ถ้าเปิดอยู่)
  // หน้าอัปโหลดของแต่ละแพลตฟอร์ม (แนบไฟล์/แคปชั่นผ่านลิงก์ไม่ได้ — แพลตฟอร์มไม่อนุญาต)
  const UPLOAD = { youtube: 'https://www.youtube.com/upload', facebook: 'https://business.facebook.com/latest/reels_composer',
    tiktok: 'https://www.tiktok.com/tiktokstudio/upload', instagram: 'https://business.facebook.com/latest/reels_composer' };
  // โลโก้แพลตฟอร์ม (วาดแบบเรียบง่ายด้วย SVG ไม่โหลดจากภายนอก)
  const LOGO = {
    youtube: '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#fff"/><path d="M10 9l5 3-5 3z" fill="#ff0000"/></svg>',
    facebook: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M13.2 21v-6.6h2.2l.4-2.6h-2.6v-1.7c0-.8.3-1.3 1.4-1.3h1.3V6.5c-.3 0-1-.1-2-.1-2.1 0-3.4 1.2-3.4 3.4v2h-2.2v2.6h2.2V21z" fill="#1877f2"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24"><path d="M15.6 3c.4 2.2 1.8 3.6 4 3.8v3c-1.5 0-2.8-.4-4-1.2v6.1c0 3.3-2.5 5.5-5.6 5.5-3 0-5.4-2.4-5.4-5.4 0-3.3 2.9-5.8 6.3-5.3v3.1c-1.6-.4-3.2.6-3.2 2.2 0 1.3 1 2.3 2.3 2.3 1.4 0 2.5-1 2.5-2.7V3z" fill="#25f4ee" transform="translate(-.8,-.6)"/><path d="M15.6 3c.4 2.2 1.8 3.6 4 3.8v3c-1.5 0-2.8-.4-4-1.2v6.1c0 3.3-2.5 5.5-5.6 5.5-3 0-5.4-2.4-5.4-5.4 0-3.3 2.9-5.8 6.3-5.3v3.1c-1.6-.4-3.2.6-3.2 2.2 0 1.3 1 2.3 2.3 2.3 1.4 0 2.5-1 2.5-2.7V3z" fill="#fe2c55" transform="translate(.8,.6)"/><path d="M15.6 3c.4 2.2 1.8 3.6 4 3.8v3c-1.5 0-2.8-.4-4-1.2v6.1c0 3.3-2.5 5.5-5.6 5.5-3 0-5.4-2.4-5.4-5.4 0-3.3 2.9-5.8 6.3-5.3v3.1c-1.6-.4-3.2.6-3.2 2.2 0 1.3 1 2.3 2.3 2.3 1.4 0 2.5-1 2.5-2.7V3z" fill="#fff"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/></svg>',
  };
  const DL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
  const HOW = { youtube: 'วางแคปชั่น: บรรทัดแรกเป็นชื่อ ที่เหลือเป็นคำอธิบาย', instagram: 'เลือก "แชร์ไปที่ Instagram" ในหน้าสร้าง Reels', facebook: 'เลือกเพจ PAAKIN ก่อนโพสต์', tiktok: 'วางแคปชั่นในช่องคำอธิบาย' };
  function renderChips() {
    const count = (k) => (k === 'all' ? S.library.length : S.library.filter((e) => e.type === k).length);
    // แสดงเฉพาะหมวดที่มีงาน (และหมวดที่กำลังเลือก) ลดปุ่มว่าง
    $('typeChips').innerHTML = FILTERS.filter(([k]) => k === 'all' || k === S.filter || count(k) > 0).map(([k, th]) => `<button class="chip" id="f-${k}" aria-pressed="${S.filter === k}" data-f="${k}">${th}<span class="n">${count(k)}</span></button>`).join('');
  }
  $('typeChips').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (!b) return; S.filter = b.dataset.f; renderChips(); renderLibrary(); });
  function captionText(p, c) {
    if (!c) return '';
    if (p === 'youtube') return [c.title, '', c.description, (c.tags || []).map((x) => '#' + x.replace(/^#/, '')).join(' ')].join('\n').trim();
    return [c.text, (c.hashtags || []).join(' ')].filter(Boolean).join('\n\n');
  }
  const fmtDate = (d) => (d ? new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : '');
  function renderLibrary() {
    renderChips();
    const items = S.library.filter((e) => S.filter === 'all' || e.type === S.filter);
    if (!items.length) {
      $('libList').innerHTML = `<div class="card empty">${S.library.length ? 'ไม่มีงานในหมวดนี้' : 'คลังยังว่าง — งานที่ทำเสร็จจะถูกเก็บที่นี่พร้อมแคปชั่นแยกแพลตฟอร์ม'}</div>`;
      return;
    }
    $('libList').innerHTML = items.map((e) => {
      const posted = e.posted || {}, id = esc(e.id);
      const meta = [TYPE_TH[e.type] || e.type, fmtDate(e.created)].filter(Boolean).map(esc).join(' · ');
      const avail = e.captions ? Object.keys(PLAT_TH).filter((p) => e.captions[p]) : [];
      const sel = open[e.id];
      // แท็บแพลตฟอร์ม = สถานะโพสต์ในตัว (✓ = โพสต์แล้ว) — กดเพื่อเปิดแคปชั่น
      const tabs = avail.length ? `<div class="seg" role="tablist">${avail.map((p) => `<button role="tab" data-seg="${p}" data-id="${id}" aria-selected="${p === sel}" class="${posted[p] ? 'done' : ''}">${posted[p] ? '✓ ' : ''}${PLAT_TH[p]}</button>`).join('')}</div>` : '';
      const panel = sel ? `<div class="cap">
          <pre>${esc(captionText(sel, e.captions[sel]))}</pre>
          <div class="postrow">
            <a class="go go-${sel}" href="${UPLOAD[sel]}" target="_blank" rel="noopener" data-id="${id}" data-p="${sel}">${LOGO[sel]}<span>คัดลอกและเปิด ${PLAT_TH[sel]}</span></a>
            <button class="mark ${posted[sel] ? 'on' : ''}" data-mark="${sel}" data-id="${id}" aria-pressed="${!!posted[sel]}" title="ทำเครื่องหมายว่าโพสต์แล้ว">✓</button>
          </div>
        </div>` : '';
      return `<article class="card item">
        <div class="item-head"><div class="kind">${ICON[e.type] || ICON.story_clip}</div><div style="min-width:0"><h3>${esc(e.title)}</h3><div class="sub">${meta} · <span class="st ${esc(e.status)}">${STATUS_TH[e.status] || esc(e.status)}</span></div></div>
          ${e.video_url ? `<button class="dl" data-dl="${id}" aria-label="ดาวน์โหลดวิดีโอ" title="ดาวน์โหลดวิดีโอ">${DL_SVG}</button>` : ''}</div>
        ${tabs}${panel}
      </article>`;
    }).join('');
  }
  $('libList').addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-toggle]');
    if (t) { const id = t.dataset.toggle, e = S.library.find((x) => x.id === id); open[id] = open[id] ? null : Object.keys(PLAT_TH).find((p) => e.captions[p]); renderLibrary(); return; }
    const go = ev.target.closest('a.go');
    if (go) { const e = S.library.find((x) => x.id === go.dataset.id); try { navigator.clipboard.writeText(captionText(go.dataset.p, e.captions[go.dataset.p])).catch(() => {}); } catch (_) {} toast('คัดลอกแคปชั่นแล้ว วางในหน้าที่เปิดได้เลย'); return; }
    const mk = ev.target.closest('[data-mark]');
    if (mk) { markPosted(mk.dataset.id, mk.dataset.mark, mk); return; }
    const dl = ev.target.closest('[data-dl]');
    if (dl) { downloadVideo(dl.dataset.dl, dl); return; }
    const sg = ev.target.closest('[data-seg]');
    if (sg) { open[sg.dataset.id] = open[sg.dataset.id] === sg.dataset.seg ? null : sg.dataset.seg; renderLibrary(); return; }
    const b = ev.target.closest('button.copy'); if (!b) return;
    const e = S.library.find((x) => x.id === b.dataset.id); if (!e) return;
    const text = captionText(b.dataset.p, e.captions[b.dataset.p]);
    const label = b.querySelector('span');
    const ok = () => { label.textContent = 'คัดลอกแล้ว'; b.classList.add('done'); setTimeout(() => { label.textContent = 'คัดลอก'; b.classList.remove('done'); }, 1600); };
    const fallback = () => { const pre = b.closest('.cap').querySelector('pre'); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); label.textContent = 'เลือกข้อความแล้ว'; };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (err) { fallback(); }
  });

  async function markPosted(id, plat, btn) {
    const db = window.__db; const e = S.library.find((x) => x.id === id); if (!db || !e) return;
    const on = !(e.posted && e.posted[plat]);
    const posted = { ...(e.posted || {}), [plat]: on ? new Date().toISOString().slice(0, 10) : null };
    const status = Object.values(posted).some(Boolean) ? 'posted' : 'ready';
    btn.disabled = true;
    try { await db.collection('library').doc(id).update({ posted, status }); }
    catch (err) { toast('บันทึกไม่ได้ (ไม่มีสิทธิ์แก้)'); }
    btn.disabled = false;
  }
  function toast(t) { let el = $('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); }
  async function downloadVideo(id, btn) {
    const e = S.library.find((x) => x.id === id);
    const dls = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dls) { toast('ดาวน์โหลดในหน้านี้ไม่ได้ ใช้ไฟล์ที่ส่งในแชท'); return; }
    btn.disabled = true;
    try { const blob = await (await fetch(e.video_url)).blob(); await dls.save({ filename: (e.id || 'clip') + '.mp4', data: blob }); }
    catch (err) { if (!err || err.code !== 'dismissed') toast('ดาวน์โหลดไม่สำเร็จ ลองอีกครั้ง'); }
    btn.disabled = false;
  }

  // ---------- รายงาน ----------
  // รายงาน: บนสุด = สิ่งที่คุณต้องทำ · แถบตัวเลขสั้น · รายละเอียดพับไว้
  const openRep = {};
  function parseReport(text) {
    const kv = [];
    for (const l of String(text || '').split('\n')) { const i = l.indexOf(':'); if (i > 0 && i < 24) kv.push([l.slice(0, i).trim(), l.slice(i + 1).trim()]); }
    const take = (re) => { const k = kv.findIndex(([x]) => re.test(x)); return k < 0 ? null : kv.splice(k, 1)[0][1]; };
    return { next: take(/ทำต่อ|ต้องทำ/), summary: take(/^สรุป/), file: take(/^ไฟล์/), shots: take(/^ช็อต/), token: take(/token/i), rest: kv, raw: kv.length ? '' : String(text || '') };
  }
  function tokenBar(t) {
    const m = String(t || '').match(/(\d+(?:\.\d+)?)k.*?(\d+(?:\.\d+)?)k/i);
    if (!m) return t ? `<span>${esc(t)}</span>` : '';
    const pct = Math.min(100, Math.round(+m[1] / +m[2] * 100));
    return `<div class="tok"><div class="row"><span class="muted">token</span><span class="tnum">${m[1]}k / ${m[2]}k</span></div><div class="bar thin"><i style="width:${pct}%"></i></div></div>`;
  }
  function renderReports() {
    $('reportList').innerHTML = S.reports.length ? S.reports.map((r, idx) => {
      const R = parseReport(r.text), key = r.jobId || r.title || idx, isOpen = openRep[key] ?? idx === 0;
      const facts = [R.file && `<li><span class="muted">ไฟล์</span>${esc(R.file)}</li>`, R.shots && `<li><span class="muted">งาน</span>${esc(R.shots)}</li>`]
        .concat(R.rest.map(([k, v]) => `<li><span class="muted">${esc(k)}</span>${esc(v)}</li>`)).filter(Boolean).join('');
      return `<article class="card rep">
        <div class="report-head"><h2>${esc(r.title || r.jobId)}</h2><span class="date tnum">${esc(fmtDate(r.date) || r.date || '')}</span></div>
        ${R.next ? `<div class="todo"><b>ต้องทำต่อ</b><span>${esc(R.next)}</span></div>` : ''}
        ${R.summary ? `<p class="sum">${esc(R.summary)}</p>` : ''}
        ${isOpen ? `${tokenBar(R.token)}${facts ? `<ul class="facts">${facts}</ul>` : ''}${R.raw ? `<p class="plain">${esc(R.raw)}</p>` : ''}` : ''}
        ${(facts || R.token || R.raw) ? `<button class="more" data-rep="${esc(String(key))}">${isOpen ? 'ซ่อนรายละเอียด' : 'ดูรายละเอียด'}</button>` : ''}
      </article>`;
    }).join('') : `<div class="card empty">ยังไม่มีรายงาน — ผู้อำนวยการจะสรุปงานที่นี่ทุกครั้งที่จบงาน</div>`;
    $('lessonList').innerHTML = S.lessons.length ? S.lessons.map((l) => `<div class="lesson"><div class="row"><span class="pill">${esc(ROLE_TH[l.role] || l.role || 'ทั้งทีม')}</span><span class="muted tnum">${esc(fmtDate(l.date))}</span></div><div>${esc(l.text)}</div></div>`).join('')
      : `<div class="muted">ยังไม่มีบทเรียนใหม่ — สั่ง <b>/remember</b> เมื่อต้องการให้ทีมจำเรื่องใด</div>`;
  }

  $('reportList').addEventListener('click', (ev) => { const b = ev.target.closest('[data-rep]'); if (!b) return; const k = b.dataset.rep, i = S.reports.findIndex((r, j) => String(r.jobId || r.title || j) === k); openRep[k] = !(openRep[k] ?? i === 0); renderReports(); });
  function renderAll() { renderJob(); renderChips(); renderLibrary(); renderReports(); onJob(); }
  renderAll();

  // ---------- เชื่อมฐานข้อมูล ----------
  (async () => {
    const timer = setTimeout(() => { if (!S.connected) $('sync').textContent = 'ยังเชื่อมต่อข้อมูลไม่ได้'; }, 10000);
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) { clearTimeout(timer); $('sync').textContent = 'ออฟไลน์ (ไม่มีข้อมูล)'; return; }
    window.__db = db;
    const mark = (snap) => { if (!snap.metadata || !snap.metadata.fromCache) { S.connected = true; clearTimeout(timer); $('sync').textContent = 'อัปเดตสด'; } };
    const err = () => { clearTimeout(timer); $('sync').textContent = 'เชื่อมต่อข้อมูลไม่ได้'; };
    const rows = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    db.collection('jobs').orderBy('updated', 'desc').limit(1).onSnapshot((s) => { mark(s); S.job = rows(s)[0] || null; renderJob(); onJob(); }, err);
    db.collection('library').orderBy('created', 'desc').limit(200).onSnapshot((s) => { mark(s); S.library = rows(s); renderLibrary(); }, err);
    db.collection('reports').orderBy('date', 'desc').limit(20).onSnapshot((s) => { mark(s); S.reports = rows(s); renderReports(); }, err);
    db.collection('lessons').orderBy('date', 'desc').limit(10).onSnapshot((s) => { mark(s); S.lessons = rows(s); renderReports(); }, err);
  })();

  // สำหรับทดสอบ
  window.__office = { activeRoom: () => (S.job ? ROLE_ROOM[S.job.role] : null) };
})();
</script>
